<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Álbum de Viagens</title>
    <link rel="stylesheet" href="style.css" />
  </head>


  <body>
    <div class="mae">
      <h1>Álbum de Viagens ✈️</h1>


      <h3>Colecione suas memórias!</h3>


      <p>Selecione todos os países que você já visitou</p>


      <div class="album">
        <div class="card">
          <img src="./assets-rec/img-01.png" alt="Estados Unidos" />
          <span>Estados Unidos</span>
        </div>


        <div class="card">
          <img src="./assets-rec/img-02.png" alt="Austrália" />
          <span>Austrália</span>
        </div>


        <div class="card">
          <img src="./assets-rec/img-03.png" alt="Espanha" />
          <span>Espanha</span>
        </div>


        <div class="card">
          <img src="./assets-rec/img-04.png" alt="Marrocos" />
          <span>Marrocos</span>
        </div>


        <div class="card">
          <img src="./assets-rec/img-05.png" alt="Japão" />
          <span>Japão</span>
        </div>


        <div class="card">
          <img src="./assets-rec/img-06.png" alt="Brasil" />
          <span>Brasil</span>
        </div>


        <div class="card">
          <img src="./assets-rec/img-07.png" alt="Rússia" />
          <span>Rússia</span>
        </div>


        <div class="card">
          <img src="./assets-rec/img-08.png" alt="Itália" />
          <span>Itália</span>
        </div>


        <div class="card">
          <img src="./assets-rec/img-09.png" alt="México" />
          <span>México</span>
        </div>
      </div>
    </div>


    <script src="script.js"></script>
  </body>
</html>
